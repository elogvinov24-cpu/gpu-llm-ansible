name: Validate Ansible and GPU deployment configuration
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  static-checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validation dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          ansible-galaxy collection install -r requirements.yml
      - name: Validate playbooks, unit tests and rendered configurations
        run: ./llmctl check --use-current-env
      - name: Verify systemd unit syntax on Linux
        run: |
          sudo install -m 0755 roles/llm/files/verify_api.py /usr/local/bin/gpu-llm-check
          sudo install -m 0755 roles/llm/files/health_probe.py /usr/local/bin/gpu-llm-health
          systemd-analyze verify .cache/gpu-llm-warmup.service .cache/gpu-llm-health.service .cache/gpu-llm-health.timer
